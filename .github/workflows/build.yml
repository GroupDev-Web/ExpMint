name: Build EXP Mint editions
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build.yml'
      - 'assets/**'
      - 'calamares/**'
      - 'overlay/**'
      - 'scripts/**'
permissions:
  contents: read
concurrency:
  group: exp-mint-iso-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Build ${{ matrix.edition }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        edition: [xfce, mate, cinnamon]
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false
      - name: Install ISO tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y curl xorriso squashfs-tools rsync imagemagick \
            librsvg2-bin grub-pc-bin grub-efi-amd64-bin isolinux syslinux-common mtools
      - name: Build EXP Mint ${{ matrix.edition }}
        env:
          MINT_EDITION: ${{ matrix.edition }}
        run: sudo --preserve-env=GITHUB_WORKSPACE,MINT_EDITION ./scripts/build-iso.sh
      - name: Upload ${{ matrix.edition }} artifact
        uses: actions/upload-artifact@v4
        with:
          name: exp-mint-22.3-${{ matrix.edition }}-amd64
          path: |
            dist/exp-mint-22.3-${{ matrix.edition }}-amd64.iso
            dist/exp-mint-22.3-${{ matrix.edition }}-amd64.iso.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
